name: Publish the game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  LIVE: https://habit-fighter-1ev30m.freebuff.site
  STATIC_FILES: style.css ui.js firebase.js camera.js receipt.js game.js qrcode.js qr.js

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The game is authored in the Freebuff project and served from there.
      # This pulls the built files so the repo always matches what is live.
      - name: Pull the game from the live deploy
        run: |
          set -euo pipefail
          rm -rf docs
          mkdir -p docs/static
          curl -fsSL "$LIVE/" -o docs/index.html
          curl -fsSL "$LIVE/config.js" -o docs/config.js
          for f in $STATIC_FILES; do
            curl -fsSL "$LIVE/static/$f" -o "docs/static/$f"
          done
          touch docs/.nojekyll
          find docs -type f | sort

      - name: Publish into docs/ (GitHub Pages serves this branch folder)
        run: |
          set -euo pipefail
          git config user.name "habit-fighter"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "already up to date"
          else
            git commit -m "Mirror the live build"
            git push
          fi
