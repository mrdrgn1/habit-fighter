<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CAM PROOF — HABIT FIGHTER</title>
<style>
  :root { --bg:#0f380f; --panel:#306230; --ink:#9bbc0f; --ink2:#8bac0f; --dark:#081808; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: "Courier New", monospace; display: flex; flex-direction: column;
    align-items: center; gap: 10px; padding: 14px; text-align: center;
  }
  h1 { font-size: 13px; letter-spacing: 2px; margin: 4px 0 0; }
  p.hint { font-size: 10px; color: var(--ink2); margin: 0; max-width: 34ch; line-height: 1.5; }
  #stage {
    width: min(92vw, 420px); aspect-ratio: 4 / 3; background: var(--dark);
    border: 3px solid var(--panel); display: grid; place-items: center; overflow: hidden;
  }
  #stage video, #stage img { width: 100%; height: 100%; object-fit: cover; display: none; }
  #stage video.on, #stage img.on { display: block; }
  #stage .idle { font-size: 10px; color: var(--ink2); padding: 10px; line-height: 1.6; }
  .row { display: flex; gap: 8px; width: min(92vw, 420px); }
  button, a.btn {
    flex: 1; font-family: inherit; font-size: 11px; letter-spacing: 1px; cursor: pointer;
    background: var(--ink); color: var(--dark); border: 0; padding: 12px 6px;
    text-decoration: none; display: grid; place-items: center; border-radius: 0;
  }
  button.alt, a.alt { background: var(--panel); color: var(--ink); }
  button[hidden], a[hidden] { display: none; }
  #note { font-size: 10px; color: var(--ink2); min-height: 14px; }
</style>
</head>
<body>
  <h1>CAM PROOF</h1>
  <p class="hint">Point at the demo running on screen, tap SNAP, then keep the photo.</p>

  <div id="stage">
    <div class="idle" id="idle">CAMERA OFF</div>
    <video id="video" playsinline autoplay muted></video>
    <img id="shot" alt="captured proof" />
  </div>

  <div class="row">
    <button id="start">OPEN CAMERA</button>
    <button id="snap" class="alt" hidden>SNAP</button>
  </div>
  <div class="row">
    <a id="save" class="btn alt" hidden download="habbit-fighter-cam-proof.jpg">SAVE PHOTO</a>
    <button id="again" class="alt" hidden>RETAKE</button>
  </div>
  <div id="note"></div>
  <p class="hint"><a href="./" style="color:var(--ink)">← BACK TO THE GAME</a></p>

<script>
  const video = document.getElementById('video');
  const shot = document.getElementById('shot');
  const idle = document.getElementById('idle');
  const startBtn = document.getElementById('start');
  const snapBtn = document.getElementById('snap');
  const saveLink = document.getElementById('save');
  const againBtn = document.getElementById('again');
  const note = document.getElementById('note');
  let stream = null;

  function say(text) { note.textContent = text; }

  async function openCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false,
      });
    } catch (err) {
      say('CAMERA BLOCKED — ' + (err && err.name ? err.name : 'denied') + ' · allow camera access');
      return;
    }
    video.srcObject = stream;
    await video.play().catch(() => {});
    idle.style.display = 'none';
    video.classList.add('on');
    shot.classList.remove('on');
    startBtn.hidden = true;
    snapBtn.hidden = false;
    saveLink.hidden = true;
    againBtn.hidden = true;
    say('LIVE — FRAME THE SCREEN');
  }

  function snap() {
    if (!stream) return;
    const w = video.videoWidth || 1280;
    const h = video.videoHeight || 960;
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(video, 0, 0, w, h);
    const url = canvas.toDataURL('image/jpeg', 0.92);
    shot.src = url;
    shot.classList.add('on');
    video.classList.remove('on');
    stream.getTracks().forEach((t) => t.stop());
    stream = null;
    snapBtn.hidden = true;
    saveLink.href = url;
    saveLink.hidden = false;
    againBtn.hidden = false;
    say('CAPTURED ' + w + '×' + h + ' — SAVE PHOTO');
  }

  function retake() {
    shot.classList.remove('on');
    idle.style.display = '';
    saveLink.hidden = true;
    againBtn.hidden = true;
    startBtn.hidden = false;
    say('');
  }

  startBtn.addEventListener('click', openCamera);
  snapBtn.addEventListener('click', snap);
  againBtn.addEventListener('click', retake);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    say('THIS BROWSER HAS NO CAMERA API — OPEN THE LINK ON A PHONE');
    startBtn.disabled = true;
  }
</script>
</body>
</html>
